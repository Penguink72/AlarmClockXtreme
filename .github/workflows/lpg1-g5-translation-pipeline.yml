name: LP-G1 to G5 governed localization (Node.js only)
on:
  push:
    branches:
      - feature/p31-lpg1-g5-governed-language-pipeline-20261119
      - feature/p31-lpg-content-review-b1-20261119
      - feature/p31-lpg-content-review-b2-completion-20261120
      - integration/p31-i0-lp1-lpg-20261120
      - feature/p31-s0-canonical-source-refresh-20261120
      - feature/p31-g6-current-catalog-rebase-20261120
      - feature/p31-lp2a-live-settings-preview-20261120
      - feature/p31-lp2b1-cross-screen-language-preview-20261120
    paths:
      - "scripts/localization/**"
      - "localization/governance/**"
      - "docs/localization/**"
      - "docs/tcl/P31-LPG1-G5*"
      - ".github/workflows/lpg1-g5-translation-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-language-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: S0 - Verify source correction and stale translation reviews
        run: |
          node scripts/localization/s0-source-amendments.mjs
          node scripts/localization/s0-source-amendments.test.mjs
      - name: Verify LP0 source 200 keys and legacy data
        run: |
          node experiments/lp0-200/verify-resources.test.js
          node experiments/lp0-200/probe-core.test.js
          node scripts/localization/lp0-audit.test.mjs
      - name: G1 - Verify glossary candidate contract
        run: node scripts/localization/g1-validate-glossary.test.mjs
      - name: G2 - Extract real source callsite evidence
        run: |
          node scripts/localization/g2-index-context.mjs --out localization/governance/g2/context-evidence.json
          node scripts/localization/g2-index-context.test.mjs
      - name: G3 - Build review candidates without overwriting
        run: |
          node scripts/localization/g3-build-candidates.mjs --out localization/governance/g3/review-queue.generated.json
          node scripts/localization/g3-build-candidates.test.mjs
      - name: G4 - Audit semantic approval gate
        run: |
          node scripts/localization/g4-review-gate.mjs --out localization/governance/g4/qa-report.generated.json
          node scripts/localization/g4-review-gate.test.mjs
      - name: G4b - Verify content findings against actual Android callsites
        run: |
          node scripts/localization/g4-content-review-audit.mjs
          node scripts/localization/g4-content-review-audit.test.mjs
      - name: G4c - Triage high-priority existing strings without rewriting source
        run: |
          node scripts/localization/g4-legacy-priority-audit.mjs
          node scripts/localization/g4-legacy-priority-audit.test.mjs
      - name: G4d - Audit final 24 bilingual drafts and corrected concept bindings
        run: |
          node scripts/localization/g4-batch2-audit.mjs
          node scripts/localization/g4-batch2-audit.test.mjs
      - name: G4e - Detect stale canonical source and screen remaining legacy translations
        run: |
          node scripts/localization/g4-remaining-legacy-audit.mjs
          node scripts/localization/g4-remaining-legacy-audit.test.mjs
      - name: G5 - Generate conspicuously unreviewed preview packs
        run: |
          node scripts/localization/g5-build-language-packs.mjs --mode preview --out-dir build/localization/UNREVIEWED_PREVIEW_NOT_RELEASE
          node scripts/localization/g5-build-language-packs.test.mjs
      - name: Verify official release is blocked without approvals
        run: |
          if node scripts/localization/g5-build-language-packs.mjs --mode release; then
            echo "SECURITY FAILURE: official release wrongly permitted"
            exit 1
          fi
          echo "EXPECTED: official pack rejected without semantic approvals."
      - name: I0 - Verify G5 unreviewed preview can be imported by LP1 Debug language lab
        run: node scripts/localization/i0-bridge-contract.test.mjs build/localization/UNREVIEWED_PREVIEW_NOT_RELEASE
      - name: G6 - Rebase current canonical source and generate unreviewed review queue
        run: |
          node scripts/localization/g6-rebase-current-catalog.mjs --out-dir build/localization/G6_UNREVIEWED_CURRENT_PREVIEW
          node scripts/localization/g6-rebase-current-catalog.test.mjs
          node scripts/localization/lp2a-assets.test.mjs
          node scripts/localization/lp2b1-cross-screen.test.mjs
          if node scripts/localization/g6-rebase-current-catalog.mjs --mode release; then
            echo "SECURITY FAILURE: G6 release wrongly permitted without independent semantic approval"
            exit 1
          fi
          echo "G6 release blocked as designed."
      - name: Publish review bundle for human auditing
        uses: actions/upload-artifact@v4
        with:
          name: acx-lpg1-g5-unreviewed-language-review-bundle
          path: |
            localization/governance/g1/
            localization/governance/g2/context-evidence.json
            localization/governance/g2/concept-exclusions.json
            localization/governance/g2/unresolved-static-refs.json
            localization/governance/g3/
            localization/governance/g4/
            docs/localization/LP-G4-CONTENT-REVIEW-BATCH1-20261119.md
            docs/localization/LP-G4-LEGACY-HIGH-PRIORITY-REVIEW-20261119.md
            docs/localization/LP-G4-CONTENT-REVIEW-BATCH2-20261120.md
            docs/localization/LP-G4-LEGACY-REMAINING-REVIEW-20261120.md
            build/localization/UNREVIEWED_PREVIEW_NOT_RELEASE/
            build/localization/G6_UNREVIEWED_CURRENT_PREVIEW/
            docs/localization/LP-G1-GLOSSARY-CONTRACT-20261119.md
            docs/localization/LP-G2-CONTEXT-EVIDENCE-20261119.md
            docs/localization/LP-G3-CANDIDATE-TRANSLATIONS-20261119.md
            docs/localization/LP-G4-QA-REVIEW-GATE-20261119.md
            docs/localization/LP-G5-PACK-RELEASE-POLICY-20261119.md
          retention-days: 14
