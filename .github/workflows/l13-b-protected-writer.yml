name: ACX L13-B full typed staging and guarded Android compile
on:
  push:
    branches:
      - feature/acx-l13-b-protected-resource-writer-20261122
    paths:
      - "scripts/localization/**"
      - "localization/candidates/**"
      - "docs/localization/ACX-L13-B*"
      - "app/src/main/**"
      - ".github/workflows/l13-b-protected-writer.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-all-3100-aapt2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify 3100-row protected review packet and all resource-kind gates
        run: |
          node --test scripts/localization/l12-b6-independent-review.test.mjs
          node --test scripts/localization/l13-b-protected-xml-writer.test.mjs
          node scripts/localization/l13-b-protected-xml-writer.mjs --mode staging --out-dir build/localization/L13_B_ISOLATED_UNAPPROVED
          if node scripts/localization/l13-b-protected-xml-writer.mjs --mode release; then
            echo "SECURITY FAILURE: unsigned model drafts reached official writer" >&2
            exit 1
          fi
          echo "Unauthorized release correctly rejected."
      - name: Compile full mixed-type staging with actual Android aapt2
        shell: bash
        run: |
          set -euo pipefail
          STAGE="build/localization/L13_B_ISOLATED_UNAPPROVED"
          SDK_ROOT="\${ANDROID_HOME:-\${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/build-tools" ]]; then
            echo "Cannot claim aapt2 without SDK build tools" >&2
            exit 1
          fi
          AAPT2="$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt2 | sort -V | tail -1)"
          if [[ ! -x "$AAPT2" ]]; then
            echo "Missing aapt2" >&2
            exit 1
          fi
          "$AAPT2" version
          "$AAPT2" compile --dir "$STAGE/res" -o "$STAGE/l13-b-unapproved-typed-all.zip"
          sha256sum "$STAGE/l13-b-unapproved-typed-all.zip" > "$STAGE/aapt2-compiled-sha256.txt"
          unzip -l "$STAGE/l13-b-unapproved-typed-all.zip" > "$STAGE/aapt2-contents.txt"
          echo "All 3100 review candidates compiled ONLY in isolated staging, not app resources."
      - uses: actions/upload-artifact@v4
        with:
          name: acx-l13-b-unapproved-3100-aapt2-evidence
          path: build/localization/L13_B_ISOLATED_UNAPPROVED/
          retention-days: 14
  existing-app-resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compile existing app and native locale contract without unapproved model XML
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:processFdroidDebugResources :app:compileFdroidDebugKotlin --no-daemon --stacktrace
          test ! -f app/src/main/res/values-ja/strings_l13_reviewed.xml
          test ! -f app/src/main/res/values-b+zh+Hant+TW/strings_l13_reviewed.xml
          echo "Current product resources build. This is NOT full 3100 reviewed locale integration."
