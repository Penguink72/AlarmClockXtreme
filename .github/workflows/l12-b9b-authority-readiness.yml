name: ACX L12-9B external-authority readiness (UNSIGNED only)

on:
  push:
    branches:
      - feature/acx-l12-b9b-operational-readiness-20261123
    paths:
      - "scripts/localization/**"
      - "localization/**"
      - "docs/localization/ACX-L12-B9B*"
      - ".github/workflows/l12-b9b-authority-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-authority-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Existing L12-9 signature/writer contract and new trust-anchor path tests
        run: |
          node --test scripts/localization/l12-b9-protected-policy-intake.test.mjs
          node --test scripts/localization/l12-b9b-authority-readiness.test.mjs
      - name: Generate unsigned, version-bound 1414-row human review + 12-stratum handoff
        run: |
          node scripts/localization/l12-b9b-authority-readiness.mjs \
            --out-dir build/localization/L12_B9B_UNSIGNED_AUTHORITY_HANDOFF
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import assert from "node:assert/strict";
            const dir="build/localization/L12_B9B_UNSIGNED_AUTHORITY_HANDOFF/";
            const state=JSON.parse(readFileSync(dir+"authorization-readiness.json","utf8"));
            const review=JSON.parse(readFileSync(dir+"unsigned-row-review-queue.json","utf8"));
            const strata=JSON.parse(readFileSync(dir+"unsigned-stratum-risk-receipts.json","utf8"));
            assert.equal(state.status,"BLOCKED_AWAITING_EXTERNAL_APPROVAL");
            assert.equal(state.releasePermitted,false);
            assert.equal(state.verifiedIndependentApprovals,0);
            assert.equal(review.length,1414);
            assert.equal(strata.length,12);
            assert.equal(strata.reduce((sum,s)=>sum+s.residualRowCount,0),1686);
            assert(review.every(r=>r.independentApproved===false&&r.notSigned));
            assert(strata.every(s=>s.decision===null));
            console.log("L12-9B: real independent authorization is NOT supplied by CI.");
          '
      - name: Verify unprotected checkout cannot enable L12-9 policy or official XML
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/localization/l12-b9-protected-policy-intake.mjs \
              --verify-protected \
              --policy-envelope build/UNSIGNED.json \
              --review-envelope build/UNSIGNED.json \
              --compiler-envelope build/UNSIGNED.json; then
            echo "Security failure: unsigned policy accepted" >&2
            exit 1
          fi
          if node scripts/localization/l13-b-protected-xml-writer.mjs \
              --mode release --review-mode risk-tiered-policy \
              --policy-envelope build/UNSIGNED.json \
              --tiered-review-envelope build/UNSIGNED.json \
              --compiler-envelope build/UNSIGNED.json; then
            echo "Security failure: no external authorities, yet official XML output" >&2
            exit 1
          fi
          test ! -f app/src/main/res/values-ja/strings_l13_reviewed.xml
          test ! -f app/src/main/res/values-b+zh+Hant+TW/strings_l13_reviewed.xml
          echo "L12-9B: outside human review and three real protected signatures still required."
      - name: Publish unsigned requirements only, never private key or signed authorization
        uses: actions/upload-artifact@v4
        with:
          name: acx-l12-b9b-unsigned-authority-readiness
          path: build/localization/L12_B9B_UNSIGNED_AUTHORITY_HANDOFF/
          retention-days: 14
