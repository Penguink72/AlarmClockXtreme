name: ACX S3/S4 persisted language settings and bilingual runtime

on:
  push:
    branches: [feature/acx-s3-s4-dual-language-ui-20261123, fix/acx-s3s4-apk-install-20261123, fix/acx-visible-localization-fallbacks-20261123, hotfix/acx-screen-off-alarm-audio-20261126, hotfix/acx-locked-screen-p1-p2-20261126]
    paths:
      - "app/src/main/**"
      - "app/src/debug/**"
      - "app/src/test/java/com/sysadmindoc/alarmclock/ui/components/BilingualUiOptionsTest.kt"
      - "app/src/test/java/com/sysadmindoc/alarmclock/util/AppLanguageManagerTest.kt"
      - "docs/localization/ACX-S3-S4*"
      - ".github/workflows/s3-s4-bilingual-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-native-trilingual-and-dual-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare persistent CI debug keystore
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
          CI_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CI_DEBUG_KEYSTORE_PASSWORD }}
          CI_DEBUG_KEY_ALIAS: ${{ secrets.CI_DEBUG_KEY_ALIAS }}
          CI_DEBUG_KEY_PASSWORD: ${{ secrets.CI_DEBUG_KEY_PASSWORD }}
        run: |
          RAW_P12="${RUNNER_TEMP}/ci-debug-raw.p12"
          DEST_KEYSTORE="${RUNNER_TEMP}/ci-debug-signing.p12"
          NORM_JAVA="${RUNNER_TEMP}/NormalizeKeystore.java"
          python3 - "$RAW_P12" <<'PY'
          import base64, os, pathlib, sys

          def clean(name: str) -> str:
              return os.environ.get(name, "").lstrip("\ufeff").strip()

          b64 = "".join(clean("CI_DEBUG_KEYSTORE_BASE64").split())
          store_pass = clean("CI_DEBUG_KEYSTORE_PASSWORD")
          key_alias = clean("CI_DEBUG_KEY_ALIAS")
          key_pass = clean("CI_DEBUG_KEY_PASSWORD")
          if not b64 or not store_pass or not key_alias or not key_pass:
              raise SystemExit("ERROR: Missing persistent CI debug signing secrets in GitHub Actions.")

          print(f"::add-mask::{store_pass}")
          print(f"::add-mask::{key_pass}")
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(b64))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"CI_DEBUG_KEYSTORE_PASSWORD={store_pass}\n")
              env_file.write(f"CI_DEBUG_KEY_ALIAS={key_alias}\n")
              env_file.write(f"CI_DEBUG_KEY_PASSWORD={key_pass}\n")
          PY
          cat > "${NORM_JAVA}" <<'JAVA'
          import java.io.*;
          import java.nio.file.*;
          import java.security.*;
          import java.security.cert.Certificate;
          public class NormalizeKeystore {
              public static void main(String[] args) throws Exception {
                  char[] storePass = args[2].toCharArray();
                  String targetAlias = args[3];
                  char[] keyPass = args[4].toCharArray();
                  KeyStore src = KeyStore.getInstance("PKCS12");
                  try (InputStream in = Files.newInputStream(Path.of(args[0]))) {
                      src.load(in, storePass);
                  }
                  if (!src.aliases().hasMoreElements()) {
                      throw new IllegalStateException("No aliases in source PKCS12 keystore");
                  }
                  String srcAlias = src.aliases().nextElement();
                  Key key;
                  try {
                      key = src.getKey(srcAlias, storePass);
                  } catch (Exception e) {
                      key = src.getKey(srcAlias, new char[0]);
                  }
                  Certificate[] chain = src.getCertificateChain(srcAlias);
                  KeyStore dst = KeyStore.getInstance("PKCS12");
                  dst.load(null, storePass);
                  dst.setKeyEntry(targetAlias, key, keyPass, chain);
                  try (OutputStream out = Files.newOutputStream(Path.of(args[1]))) {
                      dst.store(out, storePass);
                  }
              }
          }
          JAVA
          CLEAN_STORE_PASS="$(python3 -c 'import os; print(os.environ["CI_DEBUG_KEYSTORE_PASSWORD"].lstrip("\ufeff").strip())')"
          CLEAN_KEY_ALIAS="$(python3 -c 'import os; print(os.environ["CI_DEBUG_KEY_ALIAS"].lstrip("\ufeff").strip())')"
          CLEAN_KEY_PASS="$(python3 -c 'import os; print(os.environ["CI_DEBUG_KEY_PASSWORD"].lstrip("\ufeff").strip())')"
          rm -f "${DEST_KEYSTORE}"
          java "${NORM_JAVA}" "${RAW_P12}" "${DEST_KEYSTORE}" "${CLEAN_STORE_PASS}" "${CLEAN_KEY_ALIAS}" "${CLEAN_KEY_PASS}"
          rm -f "${RAW_P12}" "${NORM_JAVA}"
          chmod 600 "${DEST_KEYSTORE}"
          KEYSTORE_CERT_SHA256="$(keytool -list -v -keystore "${DEST_KEYSTORE}" -storetype PKCS12 -storepass "${CLEAN_STORE_PASS}" -alias "${CLEAN_KEY_ALIAS}" | awk '/SHA256:/ {print $2; exit}')"
          echo "KEYSTORE_CERT_SHA256=${KEYSTORE_CERT_SHA256}"
          {
            echo "CI_DEBUG_KEYSTORE_PATH=${DEST_KEYSTORE}"
            echo "EXPECTED_CERT_SHA256=${KEYSTORE_CERT_SHA256}"
          } >> "$GITHUB_ENV"

      - name: Native zh-TW/ja source and no overwritten English resources
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/values/strings.xml
          test -s app/src/main/res/values-b+zh+Hant+TW/strings_s2_machine_translated.xml
          test -s app/src/main/res/values-ja/strings_s2_machine_translated.xml
          test -s app/src/main/res/values/strings_s3_s4_bilingual.xml
          test -s app/src/main/res/values-b+zh+Hant+TW/strings_s3_s4_bilingual.xml
          test -s app/src/main/res/values-ja/strings_s3_s4_bilingual.xml
          test -s app/src/main/res/values/strings_s4_navigation.xml
          test -s app/src/main/res/values-b+zh+Hant+TW/strings_s4_navigation.xml
          test -s app/src/main/res/values-ja/strings_s4_navigation.xml
          test -s app/src/main/java/com/sysadmindoc/alarmclock/ui/components/BilingualUi.kt
          test -s app/src/main/java/com/sysadmindoc/alarmclock/util/AppLanguageManager.kt
          if grep -R 'Locale.setDefault(' app/src/main/java/com/sysadmindoc/alarmclock/ui/components/BilingualUi.kt             app/src/main/java/com/sysadmindoc/alarmclock/util/AppLanguageManager.kt; then
            echo "S3 forbids JVM-global locale mutation" >&2
            exit 1
          fi
      - name: Guard visible locale resources and forbid hardcoded English regressions
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'New reliability net: if an alarm is silently suppressed' app/src/main/java/com/sysadmindoc/alarmclock/MainActivity.kt; then
            echo "User-facing update notes must use localized resources" >&2
            exit 1
          fi
          if grep -Fq '"Exact alarms designed to survive Doze mode"' app/src/main/java/com/sysadmindoc/alarmclock/ui/onboarding/OnboardingScreen.kt; then
            echo "Onboarding bullets must not be hardcoded English" >&2
            exit 1
          fi
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          base = pathlib.Path('app/src/main/res')
          folders = ['values', 'values-b+zh+Hant+TW', 'values-ja']
          actual = []
          for name in folders:
              path = base / name / 'strings_s4_visible_fallback_repair.xml'
              root = ET.parse(path).getroot()
              keys = [node.attrib['name'] for node in root.findall('string')]
              assert len(keys) == len(set(keys)), f'duplicate locale keys in {path}'
              assert len(keys) == 17, f'unexpected key count in {path}: {len(keys)}'
              actual.append(set(keys))
          assert actual[0] == actual[1] == actual[2], 'visible locale resources not 1:1'
          print('Visible localization resource parity: 17/17/17')
          PY
      - name: Guard screen-off alarm startup does not wait on UI or locale
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          code = Path("app/src/main/java/com/sysadmindoc/alarmclock/service/AlarmService.kt").read_text()
          start = code.index("    private suspend fun startAlarm(")
          end = code.index("        AlarmHapticController.vibrationDelayMillis(", start)
          launch = code[start:end]
          assert launch.count("startAudio(alarm)") == 1, "alarm audio must start exactly once"
          assert launch.index("startAudio(alarm)") < launch.index("startActivity(firingIntent)"), "audio must not depend on lockscreen UI startup"
          assert launch.index("startAudio(alarm)") < launch.index("val notification = try"), "audio must start before rich notification work"
          assert launch.index("startAudio(alarm)") < launch.index("wearNextAlarmBridge.publishAlarmFiring(alarm)"), "audio must start before wearable work"
          assert 'val notification = try {' in launch, "notification build must be caught before audio"
          assert 'wearNextAlarmBridge.publishAlarmFiring(alarm)' in launch
          assert 'Log.e(TAG, "Wearable bridge failed; audio must continue"' in launch
          assert 'Log.e(TAG, "Optional DND override failed; alarm must still play"' in launch
          print("Screen-off audio non-gating source contract: PASS")
          PY
      - name: Compile Android F-Droid Kotlin/UI and Play resource variants
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:processFdroidDebugResources             :app:compileFdroidDebugKotlin             :app:compileFdroidDebugUnitTestKotlin             :app:processPlayDebugResources             --no-daemon --stacktrace
      - name: Build installable F-Droid debug APK for S3/S4 device acceptance
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:assembleFdroidDebug -PciVersionCode=165 --no-daemon --stacktrace
          test -s app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
      - name: Verify APK package, version and persistent upgrade signing
        id: apk_meta
        run: |
          APK_PATH="app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "ERROR: Expected non-empty APK at $APK_PATH"
            exit 1
          fi
          COMMIT_SHA="$(git rev-parse HEAD)"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_BYTES="$(stat -c%s "$APK_PATH")"
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/36.0.0"
          BADGING="$("${BUILD_TOOLS_DIR}/aapt2" dump badging "$APK_PATH" | head -n 1)"
          echo "APK_BADGING=${BADGING}"
          PKG_NAME="$(echo "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(echo "$BADGING" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(echo "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          if [[ "$PKG_NAME" != "com.sysadmindoc.alarmclock.debug" ]]; then
            echo "ERROR: Unexpected package name: $PKG_NAME"
            exit 1
          fi
          if [[ "$VERSION_CODE" != "165" ]]; then
            echo "ERROR: Expected alarm reliability versionCode=165 (must exceed v164), got: $VERSION_CODE"
            exit 1
          fi
          APKSIGNER_OUT="$("${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "$APK_PATH")"
          echo "$APKSIGNER_OUT"
          CERT_SHA256_HEX="$(echo "$APKSIGNER_OUT" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}')"
          # Certificate of the already-distributed Preview 3 v147/v148 APKs
          # (run 43683771079). An in-place upgrade only works if it is identical.
          EXPECTED_UPGRADE_CERT="4F:15:3F:91:16:0F:A5:89:C6:CF:D5:5C:DE:1B:4A:CA:B3:81:A7:0B:0D:CF:31:D7:55:FF:39:40:4C:56:A2:1E"
          ACTUAL_UPGRADE_CERT="$(echo "$CERT_SHA256_HEX" | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL_UPGRADE_CERT" != "$EXPECTED_UPGRADE_CERT" ]]; then
            echo "ERROR: Signing cert ${ACTUAL_UPGRADE_CERT} differs from installed Preview 3 v148 cert ${EXPECTED_UPGRADE_CERT}; upgrade would require uninstall."
            exit 1
          fi
          echo "UPGRADE_CERT_MATCHES_V148=true"
          CERT_SHA1_HEX="$(echo "$APKSIGNER_OUT" | awk '/Signer #1 certificate SHA-1 digest:/ {print $NF; exit}')"
          CERT_DN="$(echo "$APKSIGNER_OUT" | sed -n 's/^Signer #1 certificate DN: //p' | head -n 1)"
          CERT_SHA256_COLON="$(echo "$CERT_SHA256_HEX" | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')"
          CERT_SHA1_COLON="$(echo "$CERT_SHA1_HEX" | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')"
          echo "APK_SIGNING_CERT_SHA256=${CERT_SHA256_COLON}"
          echo "APK_SIGNING_CERT_SHA1=${CERT_SHA1_COLON}"
          if [[ "$CERT_SHA256_COLON" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "ERROR: APK signing cert ($CERT_SHA256_COLON) does not match persistent CI keystore ($EXPECTED_CERT_SHA256)"
            exit 1
          fi
          printf 'commit=%s\napplicationId=%s\nversionCode=%s\nversionName=%s\napk_sha256=%s\nsigning_cert_sha256=%s\n' "$COMMIT_SHA" "$PKG_NAME" "$VERSION_CODE" "$VERSION_NAME" "$APK_SHA256" "$ACTUAL_UPGRADE_CERT" > app/build/outputs/apk/fdroid/debug/apk-metadata.txt
      - name: Publish S3/S4 test APK only, not an official signed release
        uses: actions/upload-artifact@v4
        with:
          name: acx-s3-s4-trilingual-bilingual-fdroid-debug-apk
          path: |
            app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
            app/build/outputs/apk/fdroid/debug/apk-metadata.txt
          retention-days: 14
      - name: Verify six ordered bilingual language pairs and native selection decisions
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/bilingual-ui-unit-tests.log"
          for attempt in 1 2 3; do
            echo "Bilingual test attempt ${attempt}/3"
            if bash ./gradlew :app:testFdroidDebugUnitTest \
              --tests 'com.sysadmindoc.alarmclock.ui.components.BilingualUiOptionsTest' \
              --tests 'com.sysadmindoc.alarmclock.util.AppLanguageManagerTest' \
              --tests 'com.sysadmindoc.alarmclock.service.AlarmServiceControllerTest' \
              --no-daemon --stacktrace 2>&1 | tee "$log"; then
              exit 0
            fi
            if ! grep -Eq '(status code 429|Too Many Requests|Read timed out|Connection timed out)' "$log"; then
              echo "Unit test failed for a non-network reason; no retry." >&2
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "External test dependency rate-limit persisted after three attempts" >&2
              exit 1
            fi
            sleep $((attempt * 45))
          done
      - name: Report device-only and externally blocked coverage
        shell: bash
        run: |
          echo 'Robolectric Android SDK fixture downloads are not release-gating this targeted P1/P2 change; source contract guards and available JVM service tests run. AlarmSchedulerTest regression assertions were updated.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A real screen-off alarm test on the affected Android phone remains required; emergency notification sound respects user notification and DND settings.' >> "$GITHUB_STEP_SUMMARY"
      - name: Guard real alarm API and audible emergency path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base = Path("app/src/main/java/com/sysadmindoc/alarmclock")
          scheduler = (base / "domain/AlarmScheduler.kt").read_text()
          method = scheduler.split("private fun scheduleAlarmClock(", 1)[1].split("private fun recordScheduleIncident(", 1)[0]
          assert "alarmManager.setAlarmClock(" in method, "standard alarm must use setAlarmClock"
          assert "preferencesManager.getCachedSettings().showAlarmClockIcon" not in method, "cosmetic setting must not be read during scheduling"
          assert "if (showAlarmClockIcon)" not in method, "cosmetic setting must not branch scheduling semantics"
          assert "alarmManager.setExactAndAllowWhileIdle(" not in method, "standard alarm must not downgrade when icon is hidden"
          settings = (base / "ui/settings/SettingsScreen.kt").read_text()
          assert "onToggle = viewModel::toggleAlarmClockIcon" not in settings, "do not expose a no-op toggle"
          receiver = (base / "receiver/AlarmReceiver.kt").read_text()
          assert "AlarmFullScreenFallback.postEmergency(" in receiver, "denied FGS start must surface an emergency fallback"
          notification = (base / "service/AlarmFullScreenFallback.kt").read_text()
          assert 'CHANNEL_EMERGENCY = "alarm_fgs_emergency_v1"' in notification
          assert "AudioAttributes.USAGE_ALARM" in notification
          assert "setSound(" in notification
          assert "enableVibration(true)" in notification
          service = (base / "service/AlarmService.kt").read_text()
          assert "PRIMARY_AUDIO_START_FAILED_" in service
          assert "startMusicDefaultFallback(" in service
          assert "AUDIO_FAILURE_EMERGENCY_NOTIFICATION_POSTED" in service
          print("P1/P2 alarm delivery and audible fallback source guards: PASS")
          PY
      - name: Confirm music and Room modules unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/feature/acx-s1-s2-simplified-locales-20261123...HEAD -- app/src/main/java/com/sysadmindoc/alarmclock/data/local
          echo "Only alarm scheduling, receiver and audible startup plus a misleading settings toggle changed."
          echo "Room schema, music library and playback source selection remain untouched."
      - name: Publish direct-download APK as development prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          tag="s3-s4-debug-v165-${short_sha}"
          cp "app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk" "app/build/outputs/apk/fdroid/debug/AlarmClockXtreme-S3S4-v165-debug.apk"
          apk="app/build/outputs/apk/fdroid/debug/AlarmClockXtreme-S3S4-v165-debug.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "S3/S4 alarm reliability P1+P2 v165 ($short_sha)" \
              --notes "Development test build only. VersionCode 165, persistent debug signing certificate matched against Preview 3 v148. Not a production release." \
              --prerelease
          fi
          gh release view "$tag" --json assets --jq '.assets[] | select(.name=="AlarmClockXtreme-S3S4-v165-debug.apk") | .name' | grep -Fx "AlarmClockXtreme-S3S4-v165-debug.apk"
          echo "Direct APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/AlarmClockXtreme-S3S4-v165-debug.apk" >> "$GITHUB_STEP_SUMMARY"
