name: ACX L13-C runtime locale bridge and ephemeral Android resource coverage
on:
  push:
    branches:
      - feature/acx-l13-c-runtime-locale-surface-20261123
    paths:
      - "app/src/main/java/com/sysadmindoc/alarmclock/util/**"
      - "app/src/main/java/com/sysadmindoc/alarmclock/service/AlarmService.kt"
      - "app/src/debug/java/com/sysadmindoc/alarmclock/ui/languagelab/**"
      - "app/src/test/java/com/sysadmindoc/alarmclock/util/**"
      - "scripts/localization/**"
      - "localization/**"
      - "docs/localization/ACX-L13-C*"
      - ".github/workflows/l13-c-runtime-locale-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-native-runtime-and-ephemeral-injection:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Android platform and resource compiler
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Verify L13-B source-bound typed staging remains unapproved
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/localization/l13-b-protected-xml-writer.test.mjs
          if node scripts/localization/l13-b-protected-xml-writer.mjs \
             --mode release --review-mode risk-tiered-policy; then
             echo "SECURITY FAILURE: unsigned 3100 rows reached official XML" >&2
             exit 1
          fi
          echo "L13-C cannot bypass protected L12-9 and L13-B."
      - name: Compile existing production resources and L13-C Kotlin without unapproved candidates
        shell: bash
        run: |
          set -euo pipefail
          test ! -f app/src/main/res/values-ja/strings_l13_ci_only_unapproved.xml
          test ! -f app/src/main/res/values-b+zh+Hant+TW/strings_l13_ci_only_unapproved.xml
          bash ./gradlew :app:processFdroidDebugResources :app:compileFdroidDebugKotlin \
            --no-daemon --stacktrace
      - name: Verify runtime locale route and text fallback with Robolectric
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:testFdroidDebugUnitTest \
            --tests 'com.sysadmindoc.alarmclock.util.LocaleRuntimeTextBridgeTest' \
            --tests 'com.sysadmindoc.alarmclock.util.LocaleContextTextAdapterTest' \
            --tests 'com.sysadmindoc.alarmclock.util.LocaleSelectionContractTest' \
            --no-daemon --stacktrace
      - name: CI ONLY load all 3100 model candidates in disposable res merge and test bridge
        shell: bash
        run: |
          set -euo pipefail
          STAGE="build/localization/L13_C_EPHEMERAL_UNAPPROVED"
          TARGET_ZH="app/src/main/res/values-b+zh+Hant+TW/strings_l13_ci_only_unapproved.xml"
          TARGET_JA="app/src/main/res/values-ja/strings_l13_ci_only_unapproved.xml"
          test ! -e "$TARGET_ZH"
          test ! -e "$TARGET_JA"
          trap 'rm -f "$TARGET_ZH" "$TARGET_JA"' EXIT
          node scripts/localization/l13-b-protected-xml-writer.mjs \
            --mode staging --out-dir "$STAGE"
          cp "$STAGE/res/values-b+zh+Hant+TW/strings_l13_reviewed.xml" "$TARGET_ZH"
          cp "$STAGE/res/values-ja/strings_l13_reviewed.xml" "$TARGET_JA"
          bash ./gradlew :app:processFdroidDebugResources :app:compileFdroidDebugKotlin \
            --no-daemon --stacktrace
          bash ./gradlew :app:testFdroidDebugUnitTest \
            --tests 'com.sysadmindoc.alarmclock.util.LocaleRuntimeTextBridgeTest' \
            --tests 'com.sysadmindoc.alarmclock.util.LocaleContextTextAdapterTest' \
            --no-daemon --stacktrace
          printf '%s\n' \
            'L13-C CI-ONLY disposable checkout: 3100 unreviewed resources resource-linked and Kotlin-compiled.' \
            'No official locale XML committed; no signed approval; no APK assembled.' \
            'Release remains blocked by L12-9 independent protected authority.' \
            > "$STAGE/ci-only-runtime-verification.txt"
      - name: Ensure test-only model resources were removed and no product files changed
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/src/main/res/values-b+zh+Hant+TW/strings_l13_ci_only_unapproved.xml
          test ! -e app/src/main/res/values-ja/strings_l13_ci_only_unapproved.xml
          test ! -e app/src/main/res/values-b+zh+Hant+TW/strings_l13_reviewed.xml
          test ! -e app/src/main/res/values-ja/strings_l13_reviewed.xml
          git diff --exit-code -- app/src/main
          echo "Original app/src/main unchanged after CI-only resource merge."
      - name: Publish isolated compile evidence, NOT a signed release or APK
        uses: actions/upload-artifact@v4
        with:
          name: acx-l13-c-ci-only-unapproved-resource-runtime-evidence
          path: |
            build/localization/L13_C_EPHEMERAL_UNAPPROVED/stage-manifest.json
            build/localization/L13_C_EPHEMERAL_UNAPPROVED/ci-only-runtime-verification.txt
          retention-days: 14
