name: P0 Android baseline (F-Droid)
# Scope: strict F-Droid debug APK build and unit tests in separate jobs; never deploy or install to a phone.

on:
  push:
    branches:
      - feature/playback-history-rotation
      - fix/g1-ringtone-picker-crash
      - fix/b7-ci-persistent-debug-signing
    paths:
      - ".github/workflows/p0-android-baseline.yml"
      - "app/**"
      - "wear/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-fdroid-debug-apk:
    name: Build F-Droid debug APK (strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Record build environment
        run: |
          echo "COMMIT=$(git rev-parse HEAD)"
          uname -a
          java -version
          bash ./gradlew --version

      - name: Prepare persistent CI debug keystore
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
          CI_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CI_DEBUG_KEYSTORE_PASSWORD }}
          CI_DEBUG_KEY_ALIAS: ${{ secrets.CI_DEBUG_KEY_ALIAS }}
          CI_DEBUG_KEY_PASSWORD: ${{ secrets.CI_DEBUG_KEY_PASSWORD }}
        run: |
          CLEAN_B64="$(printf '%s' "${CI_DEBUG_KEYSTORE_BASE64}" | tr -d ' \t\r\n')"
          CLEAN_STORE_PASS="$(printf '%s' "${CI_DEBUG_KEYSTORE_PASSWORD}" | tr -d '\r\n')"
          CLEAN_KEY_ALIAS="$(printf '%s' "${CI_DEBUG_KEY_ALIAS}" | tr -d '\r\n')"
          CLEAN_KEY_PASS="$(printf '%s' "${CI_DEBUG_KEY_PASSWORD}" | tr -d '\r\n')"
          if [[ -z "${CLEAN_B64}" || -z "${CLEAN_STORE_PASS}" || -z "${CLEAN_KEY_ALIAS}" || -z "${CLEAN_KEY_PASS}" ]]; then
            echo "ERROR: Missing persistent CI debug signing secrets in GitHub Actions."
            exit 1
          fi
          echo "::add-mask::${CLEAN_STORE_PASS}"
          echo "::add-mask::${CLEAN_KEY_PASS}"
          RAW_P12="${RUNNER_TEMP}/ci-debug-raw.p12"
          DEST_KEYSTORE="${RUNNER_TEMP}/ci-debug-signing.p12"
          printf '%s' "${CLEAN_B64}" | base64 --decode > "${RAW_P12}"
          chmod 600 "${RAW_P12}"
          SRC_ALIAS="$(keytool -list -v -keystore "${RAW_P12}" -storetype PKCS12 -storepass "${CLEAN_STORE_PASS}" | sed -n 's/^Alias name: //p' | head -n 1 | tr -d '\r')"
          if [[ -z "${SRC_ALIAS}" ]]; then
            echo "ERROR: No Alias name found in decoded CI debug keystore."
            exit 1
          fi
          rm -f "${DEST_KEYSTORE}"
          keytool -importkeystore \
            -srckeystore "${RAW_P12}" \
            -srcstoretype PKCS12 \
            -srcstorepass "${CLEAN_STORE_PASS}" \
            -srcalias "${SRC_ALIAS}" \
            -destkeystore "${DEST_KEYSTORE}" \
            -deststoretype PKCS12 \
            -deststorepass "${CLEAN_STORE_PASS}" \
            -destkeypass "${CLEAN_KEY_PASS}" \
            -destalias "${CLEAN_KEY_ALIAS}" \
            -noprompt
          rm -f "${RAW_P12}"
          chmod 600 "${DEST_KEYSTORE}"
          KEYSTORE_CERT_SHA256="$(keytool -list -v -keystore "${DEST_KEYSTORE}" -storetype PKCS12 -storepass "${CLEAN_STORE_PASS}" -alias "${CLEAN_KEY_ALIAS}" | awk '/SHA256:/ {print $2; exit}')"
          echo "KEYSTORE_CERT_SHA256=${KEYSTORE_CERT_SHA256}"
          {
            echo "CI_DEBUG_KEYSTORE_PATH=${DEST_KEYSTORE}"
            echo "CI_DEBUG_KEYSTORE_PASSWORD=${CLEAN_STORE_PASS}"
            echo "CI_DEBUG_KEY_ALIAS=${CLEAN_KEY_ALIAS}"
            echo "CI_DEBUG_KEY_PASSWORD=${CLEAN_KEY_PASS}"
            echo "EXPECTED_CERT_SHA256=${KEYSTORE_CERT_SHA256}"
          } >> "$GITHUB_ENV"

      - name: Build F-Droid debug APK under strict dependency verification
        id: apk
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleFdroidDebug

      - name: Verify APK file, package metadata, and persistent signing certificate
        id: apk_meta
        run: |
          APK_PATH="app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "ERROR: Expected non-empty APK at $APK_PATH"
            exit 1
          fi
          COMMIT_SHA="$(git rev-parse HEAD)"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_BYTES="$(stat -c%s "$APK_PATH")"
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/36.0.0"
          BADGING="$("${BUILD_TOOLS_DIR}/aapt2" dump badging "$APK_PATH" | head -n 1)"
          echo "APK_BADGING=${BADGING}"
          PKG_NAME="$(echo "$BADGING" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          if [[ "$PKG_NAME" != "com.sysadmindoc.alarmclock.debug" ]]; then
            echo "ERROR: Unexpected package name: $PKG_NAME"
            exit 1
          fi
          if [[ -z "$VERSION_CODE" || "$VERSION_CODE" -lt 137 ]]; then
            echo "ERROR: Unexpected versionCode: $VERSION_CODE"
            exit 1
          fi
          APKSIGNER_OUT="$("${BUILD_TOOLS_DIR}/apksigner" verify --verbose --print-certs "$APK_PATH")"
          echo "$APKSIGNER_OUT"
          CERT_SHA256_HEX="$(echo "$APKSIGNER_OUT" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}')"
          CERT_SHA1_HEX="$(echo "$APKSIGNER_OUT" | awk '/Signer #1 certificate SHA-1 digest:/ {print $NF; exit}')"
          CERT_DN="$(echo "$APKSIGNER_OUT" | sed -n 's/^Signer #1 certificate DN: //p' | head -n 1)"
          CERT_SHA256_COLON="$(echo "$CERT_SHA256_HEX" | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')"
          CERT_SHA1_COLON="$(echo "$CERT_SHA1_HEX" | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')"
          echo "APK_SIGNING_CERT_SHA256=${CERT_SHA256_COLON}"
          echo "APK_SIGNING_CERT_SHA1=${CERT_SHA1_COLON}"
          if [[ "$CERT_SHA256_COLON" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "ERROR: APK signing cert ($CERT_SHA256_COLON) does not match persistent CI keystore ($EXPECTED_CERT_SHA256)"
            exit 1
          fi
          SCHEMA_25="app/schemas/com.sysadmindoc.alarmclock.data.local.AlarmDatabase/25.json"
          if [[ -f "$SCHEMA_25" ]]; then
            cp "$SCHEMA_25" app/build/outputs/apk/fdroid/debug/25.json
            ROOM_HASH="$(python3 -c 'import json; print(json.load(open("app/schemas/com.sysadmindoc.alarmclock.data.local.AlarmDatabase/25.json"))["database"]["identityHash"])')"
            echo "ROOM_25_IDENTITY_HASH=${ROOM_HASH}"
          fi
          {
            echo "commit=${COMMIT_SHA}"
            echo "applicationId=${PKG_NAME}"
            echo "versionCode=${VERSION_CODE}"
            echo "versionName=${VERSION_NAME}"
            echo "apk_path=${APK_PATH}"
            echo "apk_size_bytes=${APK_BYTES}"
            echo "apk_sha256=${APK_SHA256}"
            echo "signing_cert_dn=${CERT_DN}"
            echo "signing_cert_sha256=${CERT_SHA256_COLON}"
            echo "signing_cert_sha1=${CERT_SHA1_COLON}"
            echo "room_25_identity_hash=${ROOM_HASH:-}"
          } | tee app/build/outputs/apk/fdroid/debug/apk-metadata.txt
          {
            echo "## G0/G1/B7 F-Droid Debug APK Build (Strict Verification & Persistent Signing)"
            echo "- Status: **PASS**"
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Application ID: \`${PKG_NAME}\`"
            echo "- Version: \`${VERSION_NAME}\` (\`versionCode=${VERSION_CODE}\`)"
            echo "- APK File: \`app-fdroid-debug.apk\`"
            echo "- Size (bytes): \`${APK_BYTES}\`"
            echo "- APK SHA-256: \`${APK_SHA256}\`"
            echo "- Signing Cert DN: \`${CERT_DN}\`"
            echo "- Signing Cert SHA-256: \`${CERT_SHA256_COLON}\`"
            echo "- Signing Cert SHA-1: \`${CERT_SHA1_COLON}\`"
            echo "- Room v25 Identity Hash: \`${ROOM_HASH:-}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/ci-debug-raw.p12" "${RUNNER_TEMP}/ci-debug-signing.p12"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: p0-fdroid-debug-apk
          path: |
            app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
            app/build/outputs/apk/fdroid/debug/apk-metadata.txt
            app/build/outputs/apk/fdroid/debug/25.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle dependency verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p0-build-dependency-verification-reports
          path: |
            build/reports/dependency-verification/
            app/build/reports/dependency-verification/
          if-no-files-found: warn
          retention-days: 14

  verify-persistent-signing-second-runner:
    name: Verify persistent signing on 2nd runner (v138 upgrade APK)
    needs: build-fdroid-debug-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Download 1st runner APK artifact
        uses: actions/download-artifact@v4
        with:
          name: p0-fdroid-debug-apk
          path: /tmp/runner1-apk

      - name: Prepare persistent CI debug keystore on 2nd runner
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
          CI_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CI_DEBUG_KEYSTORE_PASSWORD }}
          CI_DEBUG_KEY_ALIAS: ${{ secrets.CI_DEBUG_KEY_ALIAS }}
          CI_DEBUG_KEY_PASSWORD: ${{ secrets.CI_DEBUG_KEY_PASSWORD }}
        run: |
          CLEAN_B64="$(printf '%s' "${CI_DEBUG_KEYSTORE_BASE64}" | tr -d ' \t\r\n')"
          CLEAN_STORE_PASS="$(printf '%s' "${CI_DEBUG_KEYSTORE_PASSWORD}" | tr -d '\r\n')"
          CLEAN_KEY_ALIAS="$(printf '%s' "${CI_DEBUG_KEY_ALIAS}" | tr -d '\r\n')"
          CLEAN_KEY_PASS="$(printf '%s' "${CI_DEBUG_KEY_PASSWORD}" | tr -d '\r\n')"
          echo "::add-mask::${CLEAN_STORE_PASS}"
          echo "::add-mask::${CLEAN_KEY_PASS}"
          RAW_P12="${RUNNER_TEMP}/ci-debug-raw.p12"
          DEST_KEYSTORE="${RUNNER_TEMP}/ci-debug-signing.p12"
          printf '%s' "${CLEAN_B64}" | base64 --decode > "${RAW_P12}"
          chmod 600 "${RAW_P12}"
          SRC_ALIAS="$(keytool -list -v -keystore "${RAW_P12}" -storetype PKCS12 -storepass "${CLEAN_STORE_PASS}" | sed -n 's/^Alias name: //p' | head -n 1 | tr -d '\r')"
          rm -f "${DEST_KEYSTORE}"
          keytool -importkeystore \
            -srckeystore "${RAW_P12}" \
            -srcstoretype PKCS12 \
            -srcstorepass "${CLEAN_STORE_PASS}" \
            -srcalias "${SRC_ALIAS}" \
            -destkeystore "${DEST_KEYSTORE}" \
            -deststoretype PKCS12 \
            -deststorepass "${CLEAN_STORE_PASS}" \
            -destkeypass "${CLEAN_KEY_PASS}" \
            -destalias "${CLEAN_KEY_ALIAS}" \
            -noprompt
          rm -f "${RAW_P12}"
          chmod 600 "${DEST_KEYSTORE}"
          {
            echo "CI_DEBUG_KEYSTORE_PATH=${DEST_KEYSTORE}"
            echo "CI_DEBUG_KEYSTORE_PASSWORD=${CLEAN_STORE_PASS}"
            echo "CI_DEBUG_KEY_ALIAS=${CLEAN_KEY_ALIAS}"
            echo "CI_DEBUG_KEY_PASSWORD=${CLEAN_KEY_PASS}"
          } >> "$GITHUB_ENV"

      - name: Build 2nd F-Droid debug APK (versionCode=138) on 2nd runner
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleFdroidDebug -PciVersionCode=138

      - name: Compare signing certificates and package metadata between Runner 1 and Runner 2
        run: |
          APK1="/tmp/runner1-apk/app-fdroid-debug.apk"
          APK2="app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk"
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/36.0.0"
          BADGING1="$("${BUILD_TOOLS_DIR}/aapt2" dump badging "$APK1" | head -n 1)"
          BADGING2="$("${BUILD_TOOLS_DIR}/aapt2" dump badging "$APK2" | head -n 1)"
          echo "RUNNER1_BADGING=${BADGING1}"
          echo "RUNNER2_BADGING=${BADGING2}"
          PKG1="$(echo "$BADGING1" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          PKG2="$(echo "$BADGING2" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
          VC1="$(echo "$BADGING1" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VC2="$(echo "$BADGING2" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          CERT1_HEX="$("${BUILD_TOOLS_DIR}/apksigner" verify --print-certs "$APK1" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}')"
          CERT2_HEX="$("${BUILD_TOOLS_DIR}/apksigner" verify --print-certs "$APK2" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF; exit}')"
          CERT1_COLON="$(echo "$CERT1_HEX" | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')"
          CERT2_COLON="$(echo "$CERT2_HEX" | sed 's/../&:/g; s/:$//' | tr '[:lower:]' '[:upper:]')"
          echo "RUNNER1_CERT_SHA256=${CERT1_COLON}"
          echo "RUNNER2_CERT_SHA256=${CERT2_COLON}"
          if [[ "$PKG1" != "com.sysadmindoc.alarmclock.debug" || "$PKG2" != "com.sysadmindoc.alarmclock.debug" ]]; then
            echo "ERROR: Package mismatch ($PKG1 vs $PKG2)"
            exit 1
          fi
          if [[ "$VC1" != "137" || "$VC2" != "138" ]]; then
            echo "ERROR: Unexpected versionCodes ($VC1 -> $VC2)"
            exit 1
          fi
          if [[ -z "$CERT1_COLON" || "$CERT1_COLON" != "$CERT2_COLON" ]]; then
            echo "ERROR: Signing certificate SHA-256 mismatch between Runner 1 ($CERT1_COLON) and Runner 2 ($CERT2_COLON)"
            exit 1
          fi
          APK2_SHA256="$(sha256sum "$APK2" | awk '{print $1}')"
          APK2_BYTES="$(stat -c%s "$APK2")"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "applicationId=${PKG2}"
            echo "versionCode=${VC2}"
            echo "apk_size_bytes=${APK2_BYTES}"
            echo "apk_sha256=${APK2_SHA256}"
            echo "runner1_signing_cert_sha256=${CERT1_COLON}"
            echo "runner2_signing_cert_sha256=${CERT2_COLON}"
            echo "signing_cert_match=true"
          } | tee app/build/outputs/apk/fdroid/debug/apk-v138-metadata.txt
          {
            echo "## B7 Cross-Runner Signing Consistency Verification"
            echo "- Runner 1 APK (\`versionCode=${VC1}\`) Cert SHA-256: \`${CERT1_COLON}\`"
            echo "- Runner 2 APK (\`versionCode=${VC2}\`) Cert SHA-256: \`${CERT2_COLON}\`"
            echo "- Certificate Match: **EXACT MATCH (PASS)**"
            echo "- Upgrade APK SHA-256 (\`v138\`): \`${APK2_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up temporary keystore on 2nd runner
        if: always()
        run: rm -f "${RUNNER_TEMP}/ci-debug-raw.p12" "${RUNNER_TEMP}/ci-debug-signing.p12"

      - name: Upload 2nd runner upgrade APK (versionCode=138)
        uses: actions/upload-artifact@v4
        with:
          name: p0-fdroid-debug-apk-v138-upgrade-test
          path: |
            app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
            app/build/outputs/apk/fdroid/debug/apk-v138-metadata.txt
          if-no-files-found: error
          retention-days: 14

  unit-test-fdroid-debug:
    name: Unit tests F-Droid debug (strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Record unit-test environment
        run: |
          echo "COMMIT=$(git rev-parse HEAD)"
          uname -a
          java -version
          bash ./gradlew --version

      - name: Run original F-Droid unit tests under strict dependency verification
        id: unit
        run: bash ./gradlew --no-daemon --stacktrace :app:testFdroidDebugUnitTest

      - name: Extract unit-test XML summary and failure details
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          xml_files = sorted(glob.glob("app/build/test-results/testFdroidDebugUnitTest/TEST-*.xml"))
          total_tests = 0
          total_failures = 0
          total_errors = 0
          total_skipped = 0
          failure_details = []

          for path in xml_files:
              try:
                  tree = ET.parse(path)
                  root = tree.getroot()
              except Exception as exc:
                  print(f"XML_PARSE_ERROR {path}: {exc}")
                  continue
              total_tests += int(root.attrib.get("tests", 0))
              total_failures += int(root.attrib.get("failures", 0))
              total_errors += int(root.attrib.get("errors", 0))
              total_skipped += int(root.attrib.get("skipped", 0))
              for testcase in root.findall("testcase"):
                  cls = testcase.attrib.get("classname", "")
                  name = testcase.attrib.get("name", "")
                  if "RingtonePickerSheetTest" in cls or "MusicLibraryDatabaseTest" in cls:
                      failed = any(testcase.findall(t) for t in ("failure", "error"))
                      print(f"TARGET_TEST: {cls} > {name} => {'FAIL' if failed else 'PASS'}", flush=True)
                  for tag in ("failure", "error"):
                      for node in testcase.findall(tag):
                          msg = node.attrib.get("message", "")
                          typ = node.attrib.get("type", "")
                          body = (node.text or "").strip()
                          failure_details.append((cls, name, typ, msg, body))

          print(f"UNIT_TEST_COUNTS files={len(xml_files)} tests={total_tests} failures={total_failures} errors={total_errors} skipped={total_skipped}", flush=True)
          for cls, name, typ, msg, body in failure_details:
              print("=" * 80, flush=True)
              print(f"FAILED_TEST: {cls} > {name}", flush=True)
              print(f"TYPE: {typ}", flush=True)
              print(f"MESSAGE: {msg}", flush=True)
              print("STACKTRACE:", flush=True)
              print(body[:2000], flush=True)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("## G0 F-Droid Debug Unit Tests (Strict Verification)\n")
                  fh.write(f"- Step outcome: **{os.environ.get('UNIT_OUTCOME', 'unknown').upper()}**\n")
                  fh.write(f"- Suites parsed: `{len(xml_files)}`\n")
                  fh.write(f"- Total tests: `{total_tests}` | Failures: `{total_failures}` | Errors: `{total_errors}` | Skipped: `{total_skipped}`\n")
                  if failure_details:
                      fh.write("\n### Failure Details\n")
                      for cls, name, typ, msg, body in failure_details:
                          fh.write(f"- **{cls} > {name}** (`{typ}`)\n")
                          fh.write(f"  - Message: `{msg}`\n")
                          fh.write("  ```text\n")
                          fh.write(body[:1500] + "\n")
                          fh.write("  ```\n")
          PY

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-unit-test-reports
          path: |
            app/build/test-results/testFdroidDebugUnitTest/
            app/build/reports/tests/testFdroidDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Gradle dependency verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p0-test-dependency-verification-reports
          path: |
            build/reports/dependency-verification/
            app/build/reports/dependency-verification/
          if-no-files-found: warn
          retention-days: 14
