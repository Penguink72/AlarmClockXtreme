name: P0 Android baseline (F-Droid)
# Scope: strict F-Droid debug APK build and unit tests in separate jobs; never deploy or install to a phone.

on:
  push:
    branches:
      - feature/playback-history-rotation
      - fix/g1-ringtone-picker-crash
    paths:
      - ".github/workflows/p0-android-baseline.yml"
      - "app/**"
      - "wear/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-fdroid-debug-apk:
    name: Build F-Droid debug APK (strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Record build environment
        run: |
          echo "COMMIT=$(git rev-parse HEAD)"
          uname -a
          java -version
          bash ./gradlew --version

      - name: Build F-Droid debug APK under strict dependency verification
        id: apk
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleFdroidDebug

      - name: Verify APK file and record SHA-256
        id: apk_meta
        run: |
          APK_PATH="app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk"
          if [[ ! -s "$APK_PATH" ]]; then
            echo "ERROR: Expected non-empty APK at $APK_PATH"
            exit 1
          fi
          COMMIT_SHA="$(git rev-parse HEAD)"
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          APK_BYTES="$(stat -c%s "$APK_PATH")"
          SCHEMA_25="app/schemas/com.sysadmindoc.alarmclock.data.local.AlarmDatabase/25.json"
          if [[ -f "$SCHEMA_25" ]]; then
            cp "$SCHEMA_25" app/build/outputs/apk/fdroid/debug/25.json
            ROOM_HASH="$(python3 -c 'import json; print(json.load(open("app/schemas/com.sysadmindoc.alarmclock.data.local.AlarmDatabase/25.json"))["database"]["identityHash"])')"
            echo "ROOM_25_IDENTITY_HASH=${ROOM_HASH}"
          fi
          {
            echo "commit=${COMMIT_SHA}"
            echo "applicationId=com.sysadmindoc.alarmclock.debug"
            echo "apk_path=${APK_PATH}"
            echo "apk_size_bytes=${APK_BYTES}"
            echo "apk_sha256=${APK_SHA256}"
            echo "room_25_identity_hash=${ROOM_HASH:-}"
          } | tee app/build/outputs/apk/fdroid/debug/apk-metadata.txt
          {
            echo "## G0/G1 F-Droid Debug APK Build (Strict Verification)"
            echo "- Status: **PASS**"
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Application ID: \`com.sysadmindoc.alarmclock.debug\`"
            echo "- APK File: \`app-fdroid-debug.apk\`"
            echo "- Size (bytes): \`${APK_BYTES}\`"
            echo "- SHA-256: \`${APK_SHA256}\`"
            echo "- Room v25 Identity Hash: \`${ROOM_HASH:-}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: p0-fdroid-debug-apk
          path: |
            app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
            app/build/outputs/apk/fdroid/debug/apk-metadata.txt
            app/build/outputs/apk/fdroid/debug/25.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle dependency verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p0-build-dependency-verification-reports
          path: |
            build/reports/dependency-verification/
            app/build/reports/dependency-verification/
          if-no-files-found: warn
          retention-days: 14

  unit-test-fdroid-debug:
    name: Unit tests F-Droid debug (strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Record unit-test environment
        run: |
          echo "COMMIT=$(git rev-parse HEAD)"
          uname -a
          java -version
          bash ./gradlew --version

      - name: Run original F-Droid unit tests under strict dependency verification
        id: unit
        run: bash ./gradlew --no-daemon --stacktrace :app:testFdroidDebugUnitTest

      - name: Extract unit-test XML summary and failure details
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET

          xml_files = sorted(glob.glob("app/build/test-results/testFdroidDebugUnitTest/TEST-*.xml"))
          total_tests = 0
          total_failures = 0
          total_errors = 0
          total_skipped = 0
          failure_details = []

          for path in xml_files:
              try:
                  tree = ET.parse(path)
                  root = tree.getroot()
              except Exception as exc:
                  print(f"XML_PARSE_ERROR {path}: {exc}")
                  continue
              total_tests += int(root.attrib.get("tests", 0))
              total_failures += int(root.attrib.get("failures", 0))
              total_errors += int(root.attrib.get("errors", 0))
              total_skipped += int(root.attrib.get("skipped", 0))
              for testcase in root.findall("testcase"):
                  cls = testcase.attrib.get("classname", "")
                  name = testcase.attrib.get("name", "")
                  if "RingtonePickerSheetTest" in cls or "MusicLibraryDatabaseTest" in cls:
                      failed = any(testcase.findall(t) for t in ("failure", "error"))
                      print(f"TARGET_TEST: {cls} > {name} => {'FAIL' if failed else 'PASS'}", flush=True)
                  for tag in ("failure", "error"):
                      for node in testcase.findall(tag):
                          msg = node.attrib.get("message", "")
                          typ = node.attrib.get("type", "")
                          body = (node.text or "").strip()
                          failure_details.append((cls, name, typ, msg, body))

          print(f"UNIT_TEST_COUNTS files={len(xml_files)} tests={total_tests} failures={total_failures} errors={total_errors} skipped={total_skipped}", flush=True)
          for cls, name, typ, msg, body in failure_details:
              print("=" * 80, flush=True)
              print(f"FAILED_TEST: {cls} > {name}", flush=True)
              print(f"TYPE: {typ}", flush=True)
              print(f"MESSAGE: {msg}", flush=True)
              print("STACKTRACE:", flush=True)
              print(body[:2000], flush=True)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("## G0 F-Droid Debug Unit Tests (Strict Verification)\n")
                  fh.write(f"- Step outcome: **{os.environ.get('UNIT_OUTCOME', 'unknown').upper()}**\n")
                  fh.write(f"- Suites parsed: `{len(xml_files)}`\n")
                  fh.write(f"- Total tests: `{total_tests}` | Failures: `{total_failures}` | Errors: `{total_errors}` | Skipped: `{total_skipped}`\n")
                  if failure_details:
                      fh.write("\n### Failure Details\n")
                      for cls, name, typ, msg, body in failure_details:
                          fh.write(f"- **{cls} > {name}** (`{typ}`)\n")
                          fh.write(f"  - Message: `{msg}`\n")
                          fh.write("  ```text\n")
                          fh.write(body[:1500] + "\n")
                          fh.write("  ```\n")
          PY

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-unit-test-reports
          path: |
            app/build/test-results/testFdroidDebugUnitTest/
            app/build/reports/tests/testFdroidDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Gradle dependency verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p0-test-dependency-verification-reports
          path: |
            build/reports/dependency-verification/
            app/build/reports/dependency-verification/
          if-no-files-found: warn
          retention-days: 14
