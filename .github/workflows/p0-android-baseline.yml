name: P0 Android baseline (F-Droid)
# Scope: build and unit tests only; never deploy or install to a phone.
# Initial baseline for playback-history-rotation, no app source changes.

on:
  push:
    branches:
      - feature/playback-history-rotation
    paths:
      - ".github/workflows/p0-android-baseline.yml"
      - "app/**"
      - "wear/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"

permissions:
  contents: read

concurrency:
  group: p0-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-and-build:
    name: Unit tests and F-Droid debug build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Cross-check missing Gradle artifact hashes with Maven Central
        run: |
          python3 - <<'PY'
          import hashlib, urllib.error, urllib.request
          artifacts = [
              "org/junit/junit-bom/5.10.2/junit-bom-5.10.2.module",
              "com/google/guava/guava-parent/33.3.1-android/guava-parent-33.3.1-android.pom",
              "org/jetbrains/kotlinx/kotlinx-coroutines-bom/1.9.0/kotlinx-coroutines-bom-1.9.0.pom",
          ]
          root = "https://repo.maven.apache.org/maven2/"
          problems = 0
          for artifact in artifacts:
              url = root + artifact
              print(f"CHECKING {url}", flush=True)
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      body = response.read()
                  actual = hashlib.sha256(body).hexdigest()
                  print(f"SHA256 {artifact} {actual}", flush=True)
              except urllib.error.HTTPError as exc:
                  print(f"ARTIFACT_HTTP_ERROR {url} status={exc.code}", flush=True)
                  problems += 1
                  continue
              verified = False
              for algo in ("sha256", "sha512", "sha1"):
                  checksum_url = url + "." + algo
                  try:
                      with urllib.request.urlopen(checksum_url, timeout=30) as response:
                          published = response.read().decode("ascii").strip().split()[0].lower()
                      candidate = hashlib.new(algo, body).hexdigest()
                      verified = (candidate == published)
                      print(f"PUBLISHED_CHECKSUM {checksum_url} algo={algo} actual={candidate} published={published} matches={verified}", flush=True)
                      break
                  except urllib.error.HTTPError as exc:
                      print(f"CHECKSUM_UNAVAILABLE {checksum_url} status={exc.code}", flush=True)
              if not verified:
                  print(f"UNVERIFIED {url}", flush=True)
                  problems += 1
          if problems:
              raise SystemExit(f"{problems} source/checksum issues; do not amend trust metadata yet")
          PY

      - name: Record P0 environment
        run: |
          echo "COMMIT=$(git rev-parse HEAD)"
          java -version
          bash ./gradlew --version

      - name: Run original F-Droid unit tests
        id: unit
        run: bash ./gradlew --no-daemon --stacktrace :app:testFdroidDebugUnitTest

      - name: Build original F-Droid debug APK
        id: apk
        if: ${{ always() && steps.unit.outcome != 'skipped' }}
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleFdroidDebug

      - name: Upload Gradle dependency verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-dependency-verification-reports
          path: |
            build/reports/dependency-verification/
            app/build/reports/dependency-verification/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-unit-test-reports
          path: |
            app/build/test-results/testFdroidDebugUnitTest/
            app/build/reports/tests/testFdroidDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-fdroid-debug-apk
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # Diagnostic only: Gradle's proposed checksums are NOT trusted, and nothing is pushed.
      - name: Generate candidate metadata for review (not trusted)
        if: ${{ always() && (steps.unit.outcome == 'failure' || steps.apk.outcome == 'failure') }}
        continue-on-error: true
        run: |
          set +e
          bash ./gradlew --no-daemon --write-verification-metadata sha256 :app:testFdroidDebugUnitTest :app:assembleFdroidDebug
          metadata_exit=$?
          set -e
          mkdir -p p0-metadata-candidate
          cp gradle/verification-metadata.xml p0-metadata-candidate/verification-metadata.candidate.xml
          git diff -- gradle/verification-metadata.xml > p0-metadata-candidate/proposed.patch || true
          echo "Metadata candidate diagnostic exit: ${metadata_exit}"
          git diff --stat -- gradle/verification-metadata.xml || true
          sed -n '1,220p' p0-metadata-candidate/proposed.patch || true

      - name: Upload unreviewed metadata candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-metadata-candidate-NOT-TRUSTED
          path: p0-metadata-candidate/
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize baseline
        if: always()
        env:
          UNIT_RESULT: ${{ steps.unit.outcome }}
          APK_RESULT: ${{ steps.apk.outcome }}
        run: |
          {
            echo "## P0 Android baseline"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Unit tests: ${UNIT_RESULT}"
            echo "- F-Droid debug APK: ${APK_RESULT}"
            echo "- Instrumentation and real-device tests: NOT RUN"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$UNIT_RESULT" != "success" || "$APK_RESULT" != "success" ]]; then
            echo "P0 baseline has failures; inspect step logs and attached reports."
            exit 1
          fi
