<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlarmClockXtreme — LP0 200 字串語言包實驗</title>
<style>
:root{font:15px/1.55 system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#e9f2f5;background:#101921}
*{box-sizing:border-box}body{margin:0}header{padding:24px clamp(16px,3vw,40px);border-bottom:1px solid #30414a;background:#15212c}h1{font-size:1.5rem;margin:0 0 8px}h2{font-size:1.1rem;margin:0 0 12px}p{margin:8px 0;color:#aebfc8}.tag{color:#9adae7;font-size:.8rem}
main{max-width:1280px;margin:auto;padding:20px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}
section,.pane{border:1px solid #32434d;border-radius:14px;padding:18px;background:#192630;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.toolbar>label{flex:1;min-width:140px}
label{display:block;font-size:.85rem;color:#b8ccd4;margin-bottom:5px}
input,select,textarea,button{font:inherit;border-radius:8px;border:1px solid #48616c;background:#14222b;color:#f1f5f6;padding:9px;width:100%}
button{width:auto;cursor:pointer;background:#234355;border-color:#46748b}button:hover{background:#30546a}button:disabled{opacity:.4;cursor:default}
input[type=file]{display:none}input[type=checkbox]{width:auto}textarea{resize:vertical;min-height:100px}
.secondary{color:#a7bfca;font-size:.87rem}.muted{font-size:.8rem;color:#92aab5}.error{color:#ffb4a5}.ok{color:#8ee4b0}.warning{color:#f1cd7c}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid #47606e;border-radius:100px;padding:2px 9px;font-size:.8rem;color:#b5d1dc}
.key-list{max-height:53vh;overflow:auto;display:flex;flex-direction:column;gap:5px}
.key-list button{width:100%;text-align:left;padding:9px;font-size:.87rem;overflow-wrap:anywhere;background:#1e313c}
.key-list button.active{border-color:#82d5dd;background:#304858}
.key-list .sub{display:block;font-size:.76rem;color:#afc3ce;margin-top:2px}
.work{display:grid;gap:16px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{background:#0e1a21;padding:18px;border-radius:10px;border:1px dashed #4b6775;min-height:90px;word-break:break-word;white-space:pre-wrap}
.preview .primary{font-size:1.1rem;font-weight:600}.preview .second{color:#a9bdc7;margin-top:7px}
.stack{display:grid;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.code{font:12px/1.5 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
.notice{border-left:3px solid #e0b36a;padding:10px 12px;background:#2a2a2a;color:#e1cda6}
@media(max-width:820px){main{grid-template-columns:1fr}.key-list{max-height:220px}.pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>AlarmClockXtreme · LP0 語言包實驗室</h1>
<p>200 個真實字串 · 單語／雙語即時預覽 · JSON 語言包匯入、編輯與匯出</p>
<span class="tag">獨立瀏覽器原型；不會修改已安裝的 Android App，也不會連線上傳翻譯。</span>
</header>
<main>
<section class="stack">
<div>
<h2>字串目錄 <span id="totalCount"></span></h2>
<label for="search">搜尋 Key、原文或已安裝翻譯</label>
<input id="search" type="search" placeholder="例如 snooze / music / alarm">
</div>
<div>
<label for="category">功能分類</label>
<select id="category"><option value="">全部分類</option></select>
</div>
<label><input id="missingOnly" type="checkbox"> 只顯示主要語言缺少翻譯的項目</label>
<p id="visibleCount" class="muted"></p>
<div id="keyList" class="key-list" aria-label="字串項目"></div>
</section>
<div class="work">
<section>
<h2>顯示模式與已安裝語言</h2>
<div class="toolbar">
<label>顯示模式<select id="mode"><option value="single">單語全面替換</option><option value="dual" selected>雙語對照</option></select></label>
<label>主要語言<select id="primary"></select></label>
<label id="secondaryBox">對照語言<select id="secondary"></select></label>
</div>
<div id="coverage" class="pills"></div>
<p class="muted">未提供某個字串時只在該字串使用英文來源作備援，不會虛構翻譯。這是文字解析效果；尚未接上 Compose、通知及響鈴畫面。</p>
</section>
<section>
<h2>語言包操作</h2>
<div class="actions">
<button id="importButton">匯入 JSON 語言包</button><input type="file" id="filePicker" accept=".json,application/json">
<button id="exportButton">匯出主要語言包</button>
</div>
<div class="toolbar">
<label>新增空白語言包（BCP47）<input id="newLocale" placeholder="例如 ko-KR"></label>
<button id="newPackButton">建立</button>
</div>
<p id="message" role="status" aria-live="polite" class="muted"></p>
</section>
<section>
<h2>逐條翻譯與即時預覽</h2>
<div class="stack">
<div><label>固定識別鍵</label><div id="key" class="code"></div></div>
<div><label>原文（English）</label><div id="source" class="preview"></div></div>
<div class="pair">
<div><label for="translation">主要語言翻譯（可編輯）</label><textarea id="translation" spellcheck="false"></textarea></div>
<div><label>當前格式需求</label><div id="placeholder" class="preview code"></div></div>
</div>
<p id="translationStatus" class="muted"></p>
<div><label>介面預覽</label><div id="preview" class="preview"><div class="primary" id="previewPrimary"></div><div class="second" id="previewSecondary"></div></div></div>
<div class="notice">本實驗允許未完成翻譯包，但拒絕未知 Key、不相容目錄版本、錯誤格式參數或無效 JSON。匯入只在此頁工作階段使用，須匯出 JSON 才會留下變更。</div>
</div>
</section>
</div>
</main>
<script src="catalog-data.js"></script>
<script src="probe.js"></script>
</body></html>
